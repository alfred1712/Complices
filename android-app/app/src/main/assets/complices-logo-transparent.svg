<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Cómplices</title>
<desc id="desc">Cuatro siluetas en complicidad, unidas por un corazón dorado, sobre fondo bordó oscuro.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F3D58A"/>
    <stop offset=".48" stop-color="#C99A4D"/>
    <stop offset="1" stop-color="#F6DFA2"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#100B0F"/>
    <stop offset=".55" stop-color="#24151D"/>
    <stop offset="1" stop-color="#120B10"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>

<!-- Outer arc -->
<path d="M205 345 C220 145 410 75 600 205 C790 75 980 145 995 345"
      fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity=".95"/>
